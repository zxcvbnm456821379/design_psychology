<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设计心理学Anki填空卡片</title>
    <style>
        @import url('./css/index.css');
    </style>
    <script src="./js/index.js" type="module"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>设计心理学题库填空卡片</h1>
            <p>高效记忆设计心理学题库 - 共203道题目</p>
        </div>
        
        <div class="card-container">
            <div class="card">
                <div class="question" id="questionText">
                    <!-- 题目会在这里动态显示 -->
                </div>
                
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="currentNumber">0</div>
                        <div>当前题号</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalCards">203</div>
                        <div>总题目数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="correctCount">0</div>
                        <div>答对次数</div>
                    </div>
                </div>
                
                <div class="input-container" id="inputContainer">
                    <input type="text" id="answerInput" placeholder="请输入答案...">
                </div>
                
                <div class="controls">
                    <button id="showAnswer">显示答案</button>
                    <button id="checkAnswer">检查答案</button>
                    <button id="nextCard">下一题</button>
                </div>
                
                <div class="settings">
                    <h3>学习设置</h3>
                    <div class="setting-group">
                        <label for="modeSelect">学习模式：</label>
                        <select id="modeSelect">
                            <option value="review">复习模式</option>
                            <option value="exam">考试模式</option>
                            <option value="sequential">顺序学习</option>
                            <option value="random">随机学习</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label for="rangeSelect">题目范围：</label>
                        <select id="rangeSelect">
                            <option value="all">全部题目 (1-203)</option>
                            <option value="1-50">1-50题 (心理学基础)</option>
                            <option value="51-100">51-100题 (视觉与知觉)</option>
                            <option value="101-150">101-150题 (认知与记忆)</option>
                            <option value="151-203">151-203题 (审美与消费)</option>
                        </select>
                    </div>
                    <button id="restartBtn" style="background: #6c757d; color: white; margin-top: 10px;">重新开始</button>
                </div>
                
                <div class="review-list" id="reviewList">
                    <h3>需要复习的题目</h3>
                    <!-- 错题会在这里显示 -->
                </div>
            </div>
        </div>
    </div>

</body>
</html>
